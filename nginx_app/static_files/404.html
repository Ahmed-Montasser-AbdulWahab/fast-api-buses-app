<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Page Not Found or Access Denied</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #253247; font: 16px/1.5 system-ui, sans-serif; }
		main { max-width: 34rem; padding: 2.5rem; text-align: center; }
		h1 { margin: 0; color: #1769aa; font-size: clamp(4rem, 16vw, 8rem); line-height: 1; }
		h2 { margin: 1rem 0 .5rem; }
		p { color: #596579; }
		a { display: inline-block; margin-top: 1rem; padding: .7rem 1.2rem; border-radius: .4rem; background: #1769aa; color: white; text-decoration: none; }
		a:hover, a:focus { background: #105487; }
	</style>
</head>
<body>
	<main>
		<h1>404</h1>
		<h2>Page unavailable</h2>
		<p>The page you’re looking for may not exist.</p>
		<a href="/">Return to home</a>
	</main>
</body>
</html>
